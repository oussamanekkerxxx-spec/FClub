<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Confirm your email</title>
</head>
<body style="font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; color: #1b2a4a;">
  <h2 style="margin-bottom: 8px;">Confirm your email</h2>
  <p style="color: #555;">Enter the code below to verify your email address:</p>
  <div style="margin: 32px 0; text-align: center;">
    <span style="font-size: 40px; font-weight: bold; letter-spacing: 12px; color: #1b2a4a;">{{ .Token }}</span>
  </div>
  <p style="color: #555; font-size: 14px;">This code expires in 1 hour.</p>
  <p style="color: #555; font-size: 14px;">If you didn't create an account, you can safely ignore this email.</p>
</body>
</html>
